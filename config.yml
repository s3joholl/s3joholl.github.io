          title: Johannes Hollenbach
          subtitle: |-
            I am a PhD candidate in Economics at Paderborn University and a researcher at RWI - Leibniz Institute for Economic Research in Essen, Germany.

            I work in health economics and applied econometrics. My research studies how choices over the life course, especially education, affect physical and mental health in old age, how genetic endowments and inequalities moderate these effects, and what public policy can do to help.

            I was a visitor at [UW-Madison](https://isg.wisc.edu/people/) in Fall 2024 and at [WU Vienna](https://www.wu.ac.at/en/institute-for-social-policy/) in Fall 2021.
