          url: mailto:johannes.hollenbach@rwi-essen.de
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=hasnrIwAAAAJ&hl=en
        - name: LinkedIn
          url: https://www.linkedin.com/in/johannes-hollenbach

    assets:
