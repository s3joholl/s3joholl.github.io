params:
    description: "Personal website of Johannes Hollenbach, economist at RWI - Leibniz Institute for Economic Research: research papers, teaching, CV, and contact information."
    author: Johannes Hollenbach
    defaultTheme: light
    disableThemeToggle: true
    disableScrollToTop: true
    profileMode:
          enabled: true
          title: Johannes Hollenbach
          subtitle: |-
            I am a PhD candidate in Economics at Paderborn University and a researcher at RWI - Leibniz Institute for Economic Research in Essen, Germany.

            I am an applied economist working at the intersection of health, labor, and education economics. My research focuses on human capital accumulation, healthy aging, and the role of policy in promoting both. 

            In my [job market paper](https://johanneshollenbach.com/files/hollenbach_jmp.pdf), I show how genetic propensity for learning drives health returns to compulsory schooling.
            
            I was a visitor at [UW-Madison](https://isg.wisc.edu/people/) in Fall 2024 and at [WU Vienna](https://www.wu.ac.at/en/institute-for-social-policy/) in Fall 2021.
          imageUrl: images/profile_picture.jpg
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Research
              url: research/
            - name: CV
              url: files/hollenbach_cv.pdf
            - name: Teaching
              url: teaching/
            - name: Insights
              url: insights/

    socialIcons:
